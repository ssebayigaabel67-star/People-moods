<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Turbo Circuit 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.h{position:fixed;text-shadow:0 2px 4px #000;pointer-events:none}
#tl{top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;font-size:17px;font-weight:700;line-height:1.4}
#mm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:110px;height:110px;background:#0008;border-radius:8px}
#sp{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);text-align:center;font-size:40px;font-weight:800}
#sp small{font-size:14px;display:block;opacity:.8}
#nb{width:140px;height:8px;background:#0008;border-radius:4px;margin:4px auto 0;overflow:hidden}
#nf{height:100%;width:100%;background:#0cf}
#msg{top:32%;left:0;right:0;text-align:center;font-size:80px;font-weight:900;color:#ffd200}
#ctl{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:space-between;padding:0 12px}
#ctl div{display:flex;gap:10px}
.b{width:64px;height:64px;border-radius:50%;background:#fff3;border:2px solid #fff6;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.b:active{background:#fff7}
#ov{position:fixed;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
#ov h1{font-size:40px;margin:0;color:#ffd200}
#ov p{max-width:340px;margin:0;line-height:1.5;opacity:.9}
#go{font-size:22px;font-weight:800;padding:14px 40px;border:0;border-radius:30px;background:#ffd200;color:#111}
</style></head><body>
<canvas id="c"></canvas>
<div class="h" id="tl"></div><canvas id="mm" width="110" height="110"></canvas>
<div class="h" id="sp"><span id="kmh">0</span><small>KM/H</small><div id="nb"><div id="nf"></div></div></div>
<div class="h" id="msg"></div>
<div id="ctl"><div id="lf"></div><div id="rt"></div></div>
<div id="ov"><h1>TURBO CIRCUIT</h1><p>3 laps vs 3 rivals. Stay on the asphalt, use nitro on straights.</p><p>Keys: arrows / WASD to drive, Space = nitro, R = restart</p><button id="go">START RACE</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const LAPS=3,N=600,W=12,$=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene();sc.background=new THREE.Color(0x87ceeb);sc.fog=new THREE.Fog(0x87ceeb,150,600);
const cam=new THREE.PerspectiveCamera(65,1,.5,1200);
sc.add(new THREE.HemisphereLight(0xffffff,0x446644,.95));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(100,200,50);sc.add(sun);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshLambertMaterial({color:0x3a8f3a}));gr.rotation.x=-Math.PI/2;gr.position.y=-.05;sc.add(gr);
// track
const cp=[[0,-150],[120,-170],[230,-90],[200,30],[90,60],[60,140],[-60,190],[-190,120],[-210,-20],[-120,-90]].map(p=>new THREE.Vector3(p[0],0,p[1]));
const S=new THREE.CatmullRomCurve3(cp,true,'centripetal').getSpacedPoints(N).slice(0,N);
const T=S.map((p,i)=>S[(i+1)%N].clone().sub(p).normalize());
const Nn=T.map(t=>new THREE.Vector3(t.z,0,-t.x));
function strip(a,b,y,col){const pos=[],cs=[],ix=[];
 for(let i=0;i<N;i++){const p=S[i],n=Nn[i],c=col(i);pos.push(p.x+n.x*a,y,p.z+n.z*a,p.x+n.x*b,y,p.z+n.z*b);cs.push(c[0],c[1],c[2],c[0],c[1],c[2]);}
 for(let i=0;i<N;i++){const j=(i+1)%N;ix.push(2*i,2*i+1,2*j,2*i+1,2*j+1,2*j)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(cs,3));g.setIndex(ix);g.computeVertexNormals();
 sc.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide})));}
strip(-W,W,0,i=>(i%12<1?[.8,.8,.8]:[.2,.2,.22]));
const kc=i=>(Math.floor(i/3)%2?[.9,.1,.1]:[.95,.95,.95]);
strip(W,W+2,.03,kc);strip(-W-2,-W,.03,kc);
(function(){const t=T[0],h=Math.atan2(t.x,t.z),m=new THREE.MeshLambertMaterial({color:0xffffff}),d=new THREE.Group();
 const l=new THREE.Mesh(new THREE.BoxGeometry(W*2,.06,2),m);l.position.y=.06;d.add(l);
 [-1,1].forEach(s=>{const p=new THREE.Mesh(new THREE.BoxGeometry(1,9,1),new THREE.MeshLambertMaterial({color:0x333333}));p.position.set(s*(W+3),4.5,0);d.add(p)});
 const bm=new THREE.Mesh(new THREE.BoxGeometry(W*2+7,2,1),new THREE.MeshLambertMaterial({color:0xd00000}));bm.position.y=9;d.add(bm);
 d.position.copy(S[0]);d.rotation.y=h;sc.add(d)})();
// trees
const tm=new THREE.MeshLambertMaterial({color:0x1d6b2a}),tk=new THREE.MeshLambertMaterial({color:0x5a3a1a});
for(let n=0;n<140;n++){const x=(Math.random()-.5)*700,z=(Math.random()-.5)*700;let ok=true;
 for(let i=0;i<N;i+=3){const dx=x-S[i].x,dz=z-S[i].z;if(dx*dx+dz*dz<(W+10)**2){ok=false;break}}
 if(!ok)continue;const g=new THREE.Group(),c=new THREE.Mesh(new THREE.ConeGeometry(4,11,7),tm);c.position.y=8;g.add(c);
 const r=new THREE.Mesh(new THREE.CylinderGeometry(.7,.9,3),tk);r.position.y=1.5;g.add(r);g.position.set(x,0,z);g.scale.setScalar(.7+Math.random()*.8);sc.add(g)}
// cars
function mk(col){const g=new THREE.Group(),M=c=>new THREE.MeshLambertMaterial({color:c});
 const add=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);g.add(m)};
 add(2,.7,4.2,col,0,.7,0);add(1.6,.6,1.8,0x222233,0,1.3,-.3);add(2.3,.1,.6,col,0,1.4,-2);
 [[-1.05,1.4],[1.05,1.4],[-1.05,-1.4],[1.05,-1.4]].forEach(p=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.4,12),M(0x111111));w.rotation.z=Math.PI/2;w.position.set(p[0],.45,p[1]);g.add(w)});
 sc.add(g);return g}
const cols=[0xe01010,0x1060ff,0xffa000,0x9020d0];
const cars=cols.map((c,k)=>({m:mk(c),col:c,ai:k>0,top:[0,44,47,50][k],lane:(k%2?-1:1)*(2+k*1.5)}));
const P=cars[0];
let st='menu',cdT=0,msgT=0,t=0,lapStart=0,best=0,nit=100,rank=1;
function reset(){cars.forEach((c,k)=>{const i=N-6-k*6,l=k%2?-5:5;c.x=S[i].x+Nn[i].x*l;c.z=S[i].z+Nn[i].z*l;c.h=Math.atan2(T[i].x,T[i].z);c.spd=0;c.idx=i;c.prog=i-N;c.L=0;c.finT=1e9;c.off=false});
 t=0;lapStart=0;best=0;nit=100}
reset();
// input
const k={l:0,r:0,g:0,b:0,n:0};
const km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'g',KeyW:'g',ArrowDown:'b',KeyS:'b',Space:'n'};
addEventListener('keydown',e=>{if(km[e.code]){k[km[e.code]]=1;e.preventDefault()}if(e.code==='KeyR'&&st!=='menu')start()});
addEventListener('keyup',e=>{if(km[e.code])k[km[e.code]]=0});
[['lf',[['◀','l'],['▶','r']]],['rt',[['N','n'],['▼','b'],['▲','g']]]].forEach(([id,bs])=>bs.forEach(([tx,key])=>{
 const d=document.createElement('div');d.className='b';d.textContent=tx;$(id).appendChild(d);
 d.addEventListener('pointerdown',e=>{k[key]=1;e.preventDefault()});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>d.addEventListener(ev,()=>k[key]=0))}));
// sound
let ac,osc;function snd(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();osc.type='sawtooth';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=600;const g=ac.createGain();g.gain.value=.04;osc.connect(f);f.connect(g);g.connect(ac.destination);osc.start()}catch(e){}}
function start(){snd();reset();st='count';cdT=3;$('ov').style.display='none'}
$('go').onclick=start;
function fmt(s){return Math.floor(s/60)+':'+(s%60).toFixed(2).padStart(5,'0')}
function near(c){let b=1e9,bi=c.idx;for(let q=-10;q<=10;q++){const i=(c.idx+q+N)%N,dx=c.x-S[i].x,dz=c.z-S[i].z,d=dx*dx+dz*dz;if(d<b){b=d;bi=i}}
 let d=bi-c.idx;if(d<-N/2)d+=N;if(d>N/2)d-=N;c.idx=bi;c.prog+=d;c.off=Math.sqrt(b)>W+1}
function finish(){st='fin';P.finT=t;const r=cars.filter(c=>c.finT<1e9).length;
 $('ov').style.display='flex';$('ov').querySelector('h1').textContent=r===1?'YOU WIN! 🏆':'FINISHED P'+r;
 $('ov').querySelectorAll('p')[0].textContent='Time '+fmt(t)+(best?' · Best lap '+fmt(best):'');$('ov').querySelectorAll('p')[1].textContent='';$('go').textContent='RACE AGAIN'}
function upd(dt){
 if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent=''}
 if(st==='count'){cdT-=dt;$('msg').textContent=cdT>0?Math.ceil(cdT):'GO!';if(cdT<=0){st='race';t=0;lapStart=0;msgT=1}}
 else if(st==='race')t+=dt;
 const race=st==='race'||st==='fin';
 cars.forEach(c=>{
  near(c);
  if(!c.ai){
   const ctl=st==='race';let mx=c.off?22:58,bo=false;
   if(ctl&&k.n&&nit>0&&c.spd>5){bo=true;mx=c.off?30:82;nit-=30*dt}else nit=Math.min(100,nit+8*dt);
   c.boost=bo;
   if(ctl&&k.g)c.spd+=(bo?45:26)*dt;
   if(ctl&&k.b)c.spd-=(c.spd>0?55:20)*dt;
   if(!(ctl&&(k.g||k.b))||st==='fin')c.spd-=Math.sign(c.spd)*(st==='fin'?25:8)*dt;
   if(c.off)c.spd-=c.spd*1.2*dt;
   if(c.spd>mx)c.spd-=40*dt;if(c.spd<-15)c.spd=-15;
   const s=ctl?(k.l-k.r):0;c.h+=s*1.7*dt*Math.max(-1,Math.min(1,c.spd/12))*(1-Math.min(c.spd,100)/150);
  }else{
   const ti=(c.idx+8+(c.spd/7|0))%N,tp=S[ti],tx=tp.x+Nn[ti].x*c.lane,tz=tp.z+Nn[ti].z*c.lane;
   let df=Math.atan2(tx-c.x,tz-c.z)-c.h;df=Math.atan2(Math.sin(df),Math.cos(df));
   c.h+=Math.max(-2,Math.min(2,df*3))*dt;
   const rb=1+Math.max(-.1,Math.min(.1,(P.prog-c.prog)*.0003));
   const tg=race?c.top*rb*(1-Math.min(Math.abs(df),.7)*.5):0;
   c.spd+=(tg-c.spd)*Math.min(1,dt*.9);
  }
  c.x+=Math.sin(c.h)*c.spd*dt;c.z+=Math.cos(c.h)*c.spd*dt;
  const L=Math.floor(c.prog/N)+1;
  if(L>c.L){c.L=L;if(L>=2&&L<=LAPS+1&&!c.ai){const lt=t-lapStart;lapStart=t;if(!best||lt<best)best=lt;if(L<=LAPS){$('msg').textContent='LAP '+(L-1)+': '+fmt(lt);msgT=2}}
   if(L>LAPS&&c.finT>=1e9){c.finT=t;if(!c.ai)finish()}}
 });
 for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
  if(d<3.8&&d>.01){const o=(3.8-d)/2,nx=dx/d,nz=dz/d;a.x-=nx*o;a.z-=nz*o;b.x+=nx*o;b.z+=nz*o;a.spd*=.98;b.spd*=.98}}
 cars.forEach(c=>{c.m.position.set(c.x,0,c.z);c.m.rotation.y=c.h});
 // camera
 const f=new THREE.Vector3(Math.sin(P.h),0,Math.cos(P.h)),tp=new THREE.Vector3(P.x,5,P.z).addScaledVector(f,-11);
 cam.position.lerp(tp,1-Math.exp(-7*dt));cam.lookAt(P.x+f.x*6,1.5,P.z+f.z*6);
 const fov=62+Math.max(0,P.spd)*.28+(P.boost?6:0);if(Math.abs(cam.fov-fov)>.05){cam.fov+=(fov-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix()}
 if(osc)osc.frequency.value=50+Math.abs(P.spd)*2.6+(P.boost?25:0);
 // HUD
 const o=[...cars].sort((a,b)=>a.finT!==b.finT?a.finT-b.finT:b.prog-a.prog);rank=o.indexOf(P)+1;
 $('tl').innerHTML='P'+rank+'/4<br>LAP '+Math.min(LAPS,Math.max(1,P.L))+'/'+LAPS+'<br>'+fmt(t)+(best?'<br>Best '+fmt(best):'');
 $('kmh').textContent=Math.round(Math.abs(P.spd)*3.6);$('nf').style.width=nit+'%';
 mini();
}
const mmc=$('mm').getContext('2d');let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9;S.forEach(p=>{mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mnz=Math.min(mnz,p.z);mxz=Math.max(mxz,p.z)});
const ms=96/Math.max(mxx-mnx,mxz-mnz),mp=(x,z)=>[7+(x-mnx)*ms,103-(z-mnz)*ms];
function mini(){mmc.clearRect(0,0,110,110);mmc.strokeStyle='#bbb';mmc.lineWidth=4;mmc.beginPath();S.forEach((p,i)=>{const q=mp(p.x,p.z);i?mmc.lineTo(q[0],q[1]):mmc.moveTo(q[0],q[1])});mmc.closePath();mmc.stroke();
 cars.slice().reverse().forEach(c=>{const q=mp(c.x,c.z);mmc.fillStyle=c===P?'#fff':'#'+c.col.toString(16).padStart(6,'0');mmc.beginPath();mmc.arc(q[0],q[1],c===P?5:3.5,0,7);mmc.fill()})}
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;upd(dt);R.render(sc,cam)})(last);
</script></body></html>
