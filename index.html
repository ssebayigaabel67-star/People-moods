<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Borrowers</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--text:#1c1f24;--muted:#6b7280;--accent:#2563eb;--danger:#dc2626;--ok:#16a34a;--line:#e5e7eb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1c2026;--text:#f1f3f5;--muted:#9aa3ad;--accent:#60a5fa;--danger:#f87171;--ok:#4ade80;--line:#2a3038}}
:root[data-theme="dark"]{--bg:#111418;--card:#1c2026;--text:#f1f3f5;--muted:#9aa3ad;--accent:#60a5fa;--danger:#f87171;--ok:#4ade80;--line:#2a3038}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:17px}
header{padding:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
h1{font-size:22px;margin:0 0 8px}
.total{color:var(--muted);font-size:15px}
main{padding:16px;max-width:600px;margin:0 auto}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:16px}
input,textarea{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
button{font:inherit;font-size:16px;padding:12px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button.secondary{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-weight:600;font-size:18px}
.amount{font-weight:600;white-space:nowrap}
.meta{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.5}
.badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;margin-left:6px}
.open{background:#fef3c7;color:#92400e}
.done{background:#dcfce7;color:#166534}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .open{background:#422006;color:#fcd34d}:root:not([data-theme="light"]) .done{background:#052e16;color:#86efac}}
:root[data-theme="dark"] .open{background:#422006;color:#fcd34d}
:root[data-theme="dark"] .done{background:#052e16;color:#86efac}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.search{margin-bottom:12px}
</style>
</head>
<body>
<header>
  <h1>Shop Borrowers</h1>
  <div class="total" id="total"></div>
</header>
<main>
  <form id="addForm">
    <input id="name" placeholder="Name" required autocomplete="off">
    <input id="item" placeholder="What did they borrow?" autocomplete="off">
    <div class="row">
      <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Amount owed (optional)">
      <input id="date" type="date">
    </div>
    <input id="phone" type="tel" inputmode="tel" placeholder="Phone (optional)">
    <textarea id="note" rows="2" placeholder="Note (optional)"></textarea>
    <button type="submit">Add borrower</button>
  </form>
  <input class="search" id="search" placeholder="Search name..." autocomplete="off">
  <div id="list"></div>
</main>
<script>
const KEY="shopBorrowers";
let people=[];
function load(){try{people=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){people=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(people))}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return Number(n||0).toFixed(2)}
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}

function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const list=document.getElementById("list");
  const shown=people.filter(p=>!q||p.name.toLowerCase().includes(q)).sort((a,b)=>(a.returned-b.returned)||(b.created-a.created));
  const owed=people.filter(p=>!p.returned).reduce((s,p)=>s+Number(p.amount||0),0);
  document.getElementById("total").textContent=`Still out: ${people.filter(p=>!p.returned).length} item(s) · Money owed: ${money(owed)}`;
  if(!shown.length){list.innerHTML=`<div class="empty">${people.length?"No match.":"No borrowers yet. Add one above."}</div>`;return}
  list.innerHTML=shown.map(p=>`
    <div class="card">
      <div class="card-top">
        <div><span class="name">${esc(p.name)}</span><span class="badge ${p.returned?"done":"open"}">${p.returned?"Returned":"Not returned"}</span></div>
        ${p.amount?`<div class="amount">${money(p.amount)}</div>`:""}
      </div>
      <div class="meta">
        ${p.item?`Item: ${esc(p.item)}<br>`:""}
        Date: ${esc(p.date)}${p.phone?` · Phone: ${esc(p.phone)}`:""}
        ${p.note?`<br>Note: ${esc(p.note)}`:""}
      </div>
      <div class="actions">
        <button class="secondary" onclick="toggle('${p.id}')">${p.returned?"Mark not returned":"Mark returned"}</button>
        <button class="danger" onclick="removeP('${p.id}')">Delete</button>
      </div>
    </div>`).join("");
}
function toggle(id){const p=people.find(x=>x.id===id);if(p){p.returned=!p.returned;save();render()}}
function removeP(id){if(confirm("Delete this borrower?")){people=people.filter(x=>x.id!==id);save();render()}}

document.getElementById("addForm").addEventListener("submit",e=>{
  e.preventDefault();
  const name=document.getElementById("name").value.trim();
  if(!name)return;
  people.push({
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name,
    item:document.getElementById("item").value.trim(),
    amount:document.getElementById("amount").value,
    date:document.getElementById("date").value||today(),
    phone:document.getElementById("phone").value.trim(),
    note:document.getElementById("note").value.trim(),
    returned:false,
    created:Date.now()
  });
  save();
  e.target.reset();
  document.getElementById("date").value=today();
  render();
});
document.getElementById("search").addEventListener("input",render);
document.getElementById("date").value=today();
load();render();
</script>
</body>
</html>
